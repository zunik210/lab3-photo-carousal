<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power of Sequencing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>The Power of Sequencing</h1>
    <button id="sequence-one">Story 1</button>
    <button id="sequence-two">Story 2</button>
    <h2 id="story-title">Story 1: When the Call Ends</h2>

    <img
        id="image1"
        src="images/concerned.jpg"
        alt="Woman looking concerned at her phone"
        width="600"
        height="600"
    >
<p id="caption1">She anxiously holds her phone as it rings, unsure of what the call will bring.</p>

    <img
        id="image2"
        src="images/happy.jpg"
        alt="Woman happily talking on the phone"
        width="600"
        height="600"
    >
<p id="caption2">She puts her worries aside, and celebrates someone else's good news.</p>

    <img
        id="image3"
        src="images/phone.jpg"
        alt="Woman holding her phone"
        width="600"
        height="600"
    >
<p id="caption3">When the call ends, she is left questioning her own life achievements and lack of self-esteem.</p>

    <br>

    <script src="script.js"></script>

</body>
</html>
